<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>Untitled — Scenes 1–4</title>
  </head>
  <body>
    <!--
      #hero ......... the pinned, full-viewport stage. The WebGL canvas is moved
                      inside it at runtime (see main.js) so transform-pinning carries it.
      #scroll-space . transparent scroll length for Scenes 1–4 (reveal + story +
                      fall budgets; see src/style.css).
                      It must stay transparent: the canvas is visible through it.
      No text, no UI, no logos — as specified.
    -->
    <section id="hero" aria-hidden="true"></section>
    <div id="scroll-space"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
